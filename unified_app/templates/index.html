<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Visual Inspection — Stasiun Metrologi Cacat Manufaktur</title>

  <!-- Google Font: Poppins Regular & Medium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <!-- ======================================================================= -->
  <!-- MODULAR CSS STYLESHEETS                                                 -->
  <!-- ======================================================================= -->
  <!-- 1. Global Base Styles (Design tokens, Navbar, Cards, Shared Utilities) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <!-- 2. Ring Module Specific Styles (Owned by Ring Team) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ring.css') }}">
  <!-- 3. Bearing Module Specific Styles (Owned by Bearing/Casting Team) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bearing.css') }}">
  <!-- 4. Plastic Module Specific Styles (Owned by Plastic Team) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/plastic.css') }}">
  <!-- 5. Enforce uniform Poppins Regular (400/500) matching Home & Dashboard -->
  <style>
    body, body * {
      font-weight: 400 !important;
    }
    h1, h2, h3, .brand-main-title, .nav-tab-btn.active,
    .card-title, .vp-title, .decision-txt, .kpi-val, .badge-ready {
      font-weight: 500 !important;
    }
  </style>
</head>

<body>

  <!-- ========================================================================= -->
  <!-- 1. TOP NAVBAR (Modern SaaS Header - Pure White, High Legibility)         -->
  <!-- ========================================================================= -->
  <header class="app-navbar">
    <a href="/" class="nav-brand-group" style="text-decoration: none;">
      <div class="brand-title-box">
        <h1 class="brand-main-title">Automated Visual Inspection</h1>
        <span class="brand-sub-tag">Stasiun Metrologi Cacat Manufaktur</span>
      </div>
    </a>

    <!-- 3 MODULE NAVIGATION TABS: RING, BEARING, PLASTIC -->
    <nav class="nav-tabs-container">
      <button type="button" class="nav-tab-btn active" id="btnNavRing" onclick="switchNavbarModule('ring')">
        <span>Ring</span>
      </button>
      <button type="button" class="nav-tab-btn" id="btnNavBearing" onclick="switchNavbarModule('bearing')">
        <span>Bearing</span>
      </button>
      <button type="button" class="nav-tab-btn" id="btnNavPlastic" onclick="switchNavbarModule('plastic')">
        <span>Plastic</span>
      </button>
    </nav>

    <!-- RIGHT ACTIONS: System Health + Consistent navigation back to Home & Dashboard -->
    <div class="nav-right-actions">
      <span class="health-badge" id="inspectHealthBadge">Checking...</span>
      <div class="nav-pill-group">
        <a href="/" class="nav-pill-link">Home</a>
        <a href="/dashboard" class="nav-pill-link">Dashboard</a>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- 2. MODULAR WORKSPACE CONTAINERS (One per Team)                            -->
  <!-- ========================================================================= -->

  <!-- Tab 1: Bearing Ring Metrology Workspace (Owned by Ring Team) -->
  {% include 'modules/ring/workspace.html' %}

  <!-- Tab 2: Casting & Bearing Defect Workspace (Owned by Bearing/Casting Team) -->
  {% include 'modules/bearing/workspace.html' %}

  <!-- Tab 3: Plastic Injection Defect Workspace (Owned by Plastic Team) -->
  {% include 'modules/plastic/workspace.html' %}

  <!-- ========================================================================= -->
  <!-- 3. SHARED MODALS                                                          -->
  <!-- ========================================================================= -->

  <!-- Lightbox Zoom Modal (High-Resolution Visual Inspection) -->
  <div id="zoomModal" class="zoom-lightbox" onclick="closeZoom(event)">
    <div style="width: 100%; max-width: 880px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="zoomTitle" style="font-size: 1.00rem; font-weight: 700; color: #FFFFFF;">Detail Tampilan Citra</span>
      <button type="button" onclick="closeZoomDirect()" style="background: none; border: none; color: #E2E8F0; font-size: 1.5rem; cursor: pointer;">✕</button>
    </div>
    <img id="zoomImg" class="zoom-lightbox-img" src="" alt="Zoom Frame" onclick="event.stopPropagation()">
  </div>

  <!-- ========================================================================= -->
  <!-- 4. MODULAR JAVASCRIPT CONTROLLERS                                         -->
  <!-- ========================================================================= -->
  <!-- 1. Shared App Controller (Routing, Camera, Lightbox, Benchmarks) -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <!-- 2. Ring Module Controller (Ring Inspection Logic) -->
  <script src="{{ url_for('static', filename='js/ring.js') }}"></script>
  <!-- 3. Bearing Module Controller (Casting Inspection Logic) -->
  <script src="{{ url_for('static', filename='js/bearing.js') }}"></script>
  <!-- 4. Plastic Module Controller (Plastic Inspection Logic) -->
  <script src="{{ url_for('static', filename='js/plastic.js') }}"></script>
  <!-- 5. Shared Live Server & Network Signal Monitor -->
  <script src="{{ url_for('static', filename='js/health_monitor.js') }}"></script>

</body>

</html>
